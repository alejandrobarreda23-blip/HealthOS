name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - run: npm run build

      - name: Verify migrations are self-contained
        run: |
          test -f supabase/migrations/001_health_os_init.sql
          test -f supabase/migrations/002_analysis_layer.sql
          test -f supabase/migrations/014_security_hardening.sql

  android:
    runs-on: ubuntu-latest
    needs: web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Android build status
        run: |
          if [ -d android ]; then
            npm run build
            npx cap sync android
            cd android
            chmod +x gradlew
            ./gradlew assembleDebug
          else
            echo "android/ is not committed yet; Android build intentionally skipped."
            echo "Next milestone: generate it with 'npx cap add android', integrate Health Connect plugin, then commit android/."
          fi
